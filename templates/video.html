<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/fonts/manrope.css">
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <title>{{tag}} — RTSPcamTG</title>
  <style>
    /* ── Page ───────────────────────────────────────────── */
    .page-wrap {
      padding: 1.5rem 1.25rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .cam-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .cam-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      letter-spacing: -.3px;
    }

    /* ── Video frame ────────────────────────────────────── */
    .video-card {
      background: var(--frame-bg);
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      line-height: 0;
    }
    .video-card img {
      width: 100%;
      height: calc(100svh - var(--nav-h) - 6.5rem);
      min-height: 220px;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

{% set nav_actions %}
  <a href="/" class="btn btn-sm nav-back">← Назад</a>
{% endset %}
{% include 'partials/navbar.html' %}

<div class="page-wrap">
  <div class="cam-header">
    <h1 class="cam-title">{{tag}}</h1>
    <span class="badge-live">live</span>
  </div>
  <div class="video-card">
    <img id="live-frame" src="/snapshot/{{tag}}" alt="{{tag}}">
  </div>
</div>

<script>
  // Цепочка onload: следующий запрос только после загрузки предыдущего.
  // Это исключает накопление очереди при медленном ответе сервера.
  var img = document.getElementById('live-frame');

  function loadNext() {
    img.src = '/snapshot/{{tag}}?' + Date.now();
  }

  img.onload  = function() { setTimeout(loadNext, 2000); };
  img.onerror = function() { setTimeout(loadNext, 1000); };

  loadNext();
</script>
</body>
</html>
