<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/fonts/manrope.css">
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <title>{{tag}} — RTSPcamTG</title>
  <style>
    :root {
      --accent:      #4361ee;
      --accent-h:    #3451d1;
      --bg:          #f4f6fb;
      --card-bg:     #ffffff;
      --card-shadow: 0 1px 8px rgba(0,0,0,.06);
      --card-radius: 12px;
      --nav-h:       54px;
      --border:      #e8ecf4;
      --font:        'Manrope', sans-serif;
    }

    body { background: var(--bg); font-family: var(--font); margin: 0; }

    /* ── Navbar ─────────────────────────────────────────── */
    .app-nav {
      background: #fff;
      border-bottom: 1px solid var(--border);
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-brand {
      font-weight: 700;
      font-size: .95rem;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .45rem;
    }
    .app-brand:hover { color: var(--accent-h); }

    /* ── Page ───────────────────────────────────────────── */
    .page-wrap {
      padding: 1.5rem 1.25rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .cam-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .cam-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1d2e;
      margin: 0;
      letter-spacing: -.3px;
    }
    .badge-live {
      background: #ef4444;
      color: #fff;
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .1em;
      padding: .2em .5em;
      border-radius: 4px;
      text-transform: uppercase;
      animation: pulse-live 1.6s ease-in-out infinite;
    }
    @keyframes pulse-live {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    /* ── Video frame ────────────────────────────────────── */
    .video-card {
      background: #0d0d14;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      line-height: 0;
    }
    .video-card img {
      width: 100%;
      height: calc(100svh - var(--nav-h) - 6.5rem);
      min-height: 220px;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

<nav class="app-nav">
  <a class="app-brand" href="/">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 7l-7 5 7 5V7z"/>
      <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
    </svg>
    RTSPcamTG
  </a>
  <div class="ms-auto d-flex gap-2">
    <a href="/" class="btn btn-sm" style="font-size:.8rem; color:#6b7280; border:1px solid var(--border);">← Назад</a>
    <a href="/about" class="btn btn-sm btn-outline-secondary" style="font-size:.8rem; padding:.25rem .45rem;" title="О проекте">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
        <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
      </svg>
    </a>
  </div>
</nav>

<div class="page-wrap">
  <div class="cam-header">
    <h1 class="cam-title">{{tag}}</h1>
    <span class="badge-live">live</span>
  </div>
  <div class="video-card">
    <img id="live-frame" src="/snapshot/{{tag}}" alt="{{tag}}">
  </div>
</div>

<script>
  // Цепочка onload: следующий запрос только после загрузки предыдущего.
  // Это исключает накопление очереди при медленном ответе сервера.
  var img = document.getElementById('live-frame');

  function loadNext() {
    img.src = '/snapshot/{{tag}}?' + Date.now();
  }

  img.onload  = function() { setTimeout(loadNext, 2000); };
  img.onerror = function() { setTimeout(loadNext, 1000); };

  loadNext();
</script>
</body>
</html>
