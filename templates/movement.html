<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <title>camTGrtsp — События</title>
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    #status { font-size: .8rem; color: #6c757d; }
    .alarm-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); overflow: hidden; margin-bottom: 1rem; }
    .alarm-card img { width: 100%; display: block; cursor: pointer; }
    .alarm-card .info { padding: .4rem .65rem; font-size: .8rem; color: #495057; line-height: 1.4; }
    .alarm-card .cam { font-weight: 600; }
    #no-data-msg { display: none; color: #6c757d; padding: 3rem; text-align: center; }
    #load-more { display: none; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <a class="navbar-brand" href="/">📷 camTGrtsp</a>
  <a class="btn btn-sm btn-outline-light" href="/">← Главная</a>
</nav>

<div class="container-fluid px-4">
  <div class="d-flex align-items-center flex-wrap mb-3">
    <h5 class="mb-0 mr-3">События</h5>
    <div class="btn-group btn-group-sm mr-3" id="cam-filter" role="group"></div>
    <span id="status" class="ml-auto">загрузка...</span>
  </div>

  <div class="row" id="alarm-grid"></div>
  <div id="no-data-msg">Событий пока нет.</div>

  <div class="text-center mb-5">
    <button class="btn btn-outline-secondary" id="load-more">Загрузить ещё</button>
  </div>
</div>

<script>
  const LIMIT = 50;
  let currentCam = 'all';
  let currentOffset = 0;
  let allCams = [];
  let isLoading = false;

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return d + '.' + m + '.' + y;
  }

  function renderCard(item) {
    const col = document.createElement('div');
    col.className = 'col-6 col-sm-4 col-md-3 col-lg-2';
    col.innerHTML =
      '<div class="alarm-card">' +
        '<a href="' + item.url + '" target="_blank">' +
          '<img src="' + item.url + '" loading="lazy" alt="' + item.cam + '">' +
        '</a>' +
        '<div class="info">' +
          '<span class="cam">' + item.cam + '</span><br>' +
          formatDate(item.date) + ' ' + item.time +
        '</div>' +
      '</div>';
    return col;
  }

  function renderFilterButtons() {
    const container = document.getElementById('cam-filter');
    container.innerHTML = '';

    [{ id: 'all', label: 'Все' }].concat(allCams.map(c => ({ id: c, label: c }))).forEach(function(entry) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-outline-secondary' + (currentCam === entry.id ? ' active font-weight-bold' : '');
      btn.textContent = entry.label;
      btn.addEventListener('click', function() { switchCam(entry.id); });
      container.appendChild(btn);
    });
  }

  function switchCam(cam) {
    currentCam = cam;
    currentOffset = 0;
    document.getElementById('alarm-grid').innerHTML = '';
    renderFilterButtons();
    load();
  }

  function load() {
    if (isLoading) return;
    isLoading = true;
    document.getElementById('load-more').disabled = true;
    const url = '/api/alarms?cam=' + currentCam + '&offset=' + currentOffset + '&limit=' + LIMIT;
    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        // Кнопки камер строим один раз — при первом ответе
        if (allCams.length === 0 && data.cams.length > 0) {
          allCams = data.cams;
          renderFilterButtons();
        }

        const grid = document.getElementById('alarm-grid');
        data.items.forEach(function(item) { grid.appendChild(renderCard(item)); });

        const shown = currentOffset + data.items.length;
        document.getElementById('no-data-msg').style.display = shown === 0 ? 'block' : 'none';
        document.getElementById('load-more').style.display = data.has_more ? 'block' : 'none';
        document.getElementById('status').textContent =
          'Показано ' + shown + (data.has_more ? '+' : '') + ' · ' + new Date().toLocaleTimeString('ru-RU');

        currentOffset = shown;
        isLoading = false;
        document.getElementById('load-more').disabled = false;
      })
      .catch(function(err) {
        console.error('api/alarms error:', err);
        document.getElementById('status').textContent = 'ошибка загрузки';
        isLoading = false;
        document.getElementById('load-more').disabled = false;
      });
  }

  document.getElementById('load-more').addEventListener('click', load);

  load();
</script>
</body>
</html>
