<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <title>camTGrtsp — Движение</title>
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .chart-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 1.2rem; margin-bottom: 1.5rem; }
    .window-btn.active { font-weight: 700; }
    #status { font-size: .8rem; color: #6c757d; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <a class="navbar-brand" href="/">📷 camTGrtsp</a>
  <span class="text-muted small" id="status">загрузка...</span>
</nav>

<div class="container-fluid px-4">
  <div class="d-flex align-items-center mb-3">
    <h5 class="mb-0 mr-3">Активность движения</h5>
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn btn-outline-secondary window-btn active" data-minutes="30">30 мин</button>
      <button class="btn btn-outline-secondary window-btn" data-minutes="60">1 час</button>
      <button class="btn btn-outline-secondary window-btn" data-minutes="360">6 часов</button>
    </div>
  </div>

  <div class="chart-wrap">
    <canvas id="movementChart" height="100"></canvas>
  </div>
</div>

<script>
  const COLORS = [
    '#007bff','#dc3545','#28a745','#fd7e14',
    '#6f42c1','#20c997','#e83e8c','#17a2b8'
  ];

  let currentMinutes = 30;
  let chart = null;

  function buildDatasets(data) {
    return Object.entries(data).map(([cam, points], i) => ({
      label: cam,
      data: points.map(p => ({ x: p.t, y: p.v })),
      borderColor: COLORS[i % COLORS.length],
      backgroundColor: COLORS[i % COLORS.length] + '22',
      borderWidth: 1.5,
      pointRadius: 0,
      fill: true,
      tension: 0.3,
    }));
  }

  function initChart(data) {
    const ctx = document.getElementById('movementChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: { datasets: buildDatasets(data) },
      options: {
        animation: false,
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top' },
          tooltip: {
            callbacks: {
              label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(2)
            }
          }
        },
        scales: {
          x: {
            type: 'time',
            time: { tooltipFormat: 'HH:mm:ss', displayFormats: { minute: 'HH:mm', second: 'HH:mm:ss' } },
            title: { display: true, text: 'Время' },
          },
          y: {
            title: { display: true, text: 'Активность' },
            beginAtZero: true,
          }
        }
      }
    });
  }

  function updateChart(data) {
    if (!chart) { initChart(data); return; }
    const datasets = buildDatasets(data);
    chart.data.datasets = datasets;
    chart.update('none');
  }

  function load() {
    fetch('/api/movement?minutes=' + currentMinutes)
      .then(r => r.json())
      .then(data => {
        updateChart(data);
        const total = Object.values(data).reduce((s, pts) => s + pts.length, 0);
        const now = new Date().toLocaleTimeString('ru-RU');
        document.getElementById('status').textContent = total + ' точек · обновлено ' + now;
      })
      .catch(() => { document.getElementById('status').textContent = 'ошибка загрузки'; });
  }

  document.querySelectorAll('.window-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.window-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentMinutes = parseInt(this.dataset.minutes);
      load();
    });
  });

  load();
  setInterval(load, 10000);
</script>
</body>
</html>
