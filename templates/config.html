<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/fonts/manrope.css">
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <title>RTSPcamTG — Config</title>
  <style>
    :root {
      --accent:      #4361ee;
      --accent-h:    #3451d1;
      --bg:          #f4f6fb;
      --card-bg:     #ffffff;
      --card-shadow: 0 1px 8px rgba(0,0,0,.06);
      --card-radius: 12px;
      --nav-h:       54px;
      --border:      #e8ecf4;
      --font:        'Manrope', sans-serif;
    }

    body { background: var(--bg); font-family: var(--font); }

    /* ── Navbar ─────────────────────────────────────────── */
    .app-nav {
      background: #fff;
      border-bottom: 1px solid var(--border);
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-brand {
      font-weight: 700;
      font-size: .95rem;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .45rem;
    }
    .app-brand:hover { color: var(--accent-h); }

    /* ── Page wrap ──────────────────────────────────────── */
    .page-wrap {
      padding: 1.5rem 1rem;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── Config card ────────────────────────────────────── */
    .config-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .section-label {
      font-size: .68rem;
      font-weight: 700;
      color: #9ca3af;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .85rem;
    }

    /* ── Form fields ────────────────────────────────────── */
    .form-label { font-size: .85rem; font-weight: 500; color: #374151; margin-bottom: .3rem; }
    .form-control {
      font-family: var(--font);
      font-size: .875rem;
      border-color: var(--border);
      border-radius: 8px;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(67,97,238,.12);
    }

    /* ── Stream list ────────────────────────────────────── */
    .stream-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      padding: .6rem .75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: .5rem;
      background: #fff;
    }
    .stream-label { min-width: 0; overflow: hidden; flex: 1; }
    .stream-label strong { font-size: .875rem; color: #1a1d2e; }
    .stream-label small  { color: #9ca3af; font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .stream-actions { display: flex; align-items: center; gap: .35rem; flex-shrink: 0; }
    .stream-actions .btn { font-size: .75rem; padding: .2rem .55rem; border-radius: 6px; }

    /* ── Save notice ────────────────────────────────────── */
    #save-ok {
      font-size: .8rem;
      color: #22c55e;
      font-weight: 600;
      opacity: 0;
      transition: opacity .3s;
    }
    #save-ok.visible { opacity: 1; }

    /* ── Polygon canvas ─────────────────────────────────── */
    #polygon-canvas { cursor: crosshair; display: block; max-width: 100%; }
    #canvas-wrap    { position: relative; background: #000; line-height: 0; width: 100%; border-radius: 8px; overflow: hidden; }
    .point-hint     { font-size: .8rem; color: #6b7280; }

    /* ── Modal tweaks ───────────────────────────────────── */
    .modal-content {
      border: none;
      border-radius: var(--card-radius);
      box-shadow: 0 8px 40px rgba(0,0,0,.15);
      font-family: var(--font);
    }
    .modal-header { border-bottom: 1px solid var(--border); padding: 1rem 1.25rem; }
    .modal-footer { border-top: 1px solid var(--border); padding: .75rem 1.25rem; }
    .modal-title  { font-size: .95rem; font-weight: 700; color: #1a1d2e; }
  </style>
</head>
<body>

<nav class="app-nav">
  <a class="app-brand" href="/">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 7l-7 5 7 5V7z"/>
      <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
    </svg>
    RTSPcamTG
  </a>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span id="save-ok">Сохранено</span>
    <a href="/about" class="btn btn-sm btn-outline-secondary" style="font-size:.8rem; padding:.25rem .45rem;" title="О проекте">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
        <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
      </svg>
    </a>
  </div>
</nav>

<div class="page-wrap">

  <!-- Telegram -->
  <div class="config-card">
    <div class="section-label">Telegram</div>
    <div class="mb-3">
      <label class="form-label" for="tg_token">Bot API Token</label>
      <input type="text" class="form-control" id="tg_token" placeholder="123456:ABC-DEF…">
    </div>
    <div class="mb-0">
      <label class="form-label" for="tg_chat">Chat ID</label>
      <input type="text" class="form-control" id="tg_chat" placeholder="-100123456789">
    </div>
  </div>

  <!-- RTSP Streams -->
  <div class="config-card">
    <div class="section-label">RTSP Streams</div>
    <div id="streams"></div>

    <hr style="border-color: var(--border); margin: .85rem 0;">

    <div id="add-stream-form">
      <div class="row g-2 align-items-end">
        <div class="col-4">
          <label class="form-label mb-1" for="new-label" style="font-size:.78rem;">Label</label>
          <input type="text" class="form-control form-control-sm" id="new-label"
                 placeholder="koridor" autocomplete="off">
        </div>
        <div class="col">
          <label class="form-label mb-1" for="new-url" style="font-size:.78rem;">RTSP URL</label>
          <input type="text" class="form-control form-control-sm" id="new-url"
                 placeholder="rtsp://admin:pass@192.168.1.1:554/…" autocomplete="off">
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-stream">+ Добавить</button>
        </div>
      </div>
      <div class="text-danger small mt-1 d-none" id="add-stream-error"></div>
    </div>
  </div>

  <div class="d-grid">
    <button type="button" class="btn btn-primary" id="btn_Save" style="font-family: var(--font); font-weight: 600;">
      Сохранить
    </button>
  </div>

</div><!-- /page-wrap -->

<!-- ── Polygon editor modal ───────────────────────────── -->
<div class="modal fade" id="polygonModal" tabindex="-1" aria-labelledby="polygonModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="polygonModalLabel">Зона детекции: <span id="modal-cam-name"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <p class="point-hint mb-2">
          Кликайте по изображению чтобы поставить точки зоны. Ровно <strong>4 точки</strong>.
        </p>
        <div id="canvas-wrap">
          <canvas id="polygon-canvas"></canvas>
        </div>
        <div class="mt-2 d-flex justify-content-between align-items-center">
          <span class="point-hint" id="point-count">Точек: 0 / 4</span>
          <button type="button" class="btn btn-sm btn-outline-danger" id="btn-clear-zone">Очистить</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-sm btn-primary" id="btn-save-zone" disabled>Сохранить зону</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Edit camera modal ──────────────────────────────── -->
<div class="modal fade" id="editCamModal" tabindex="-1" aria-labelledby="editCamModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editCamModalLabel">Редактировать камеру</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-original-label">
        <div class="mb-3">
          <label class="form-label" for="edit-label">Label</label>
          <input type="text" class="form-control" id="edit-label" autocomplete="off">
        </div>
        <div class="mb-0">
          <label class="form-label" for="edit-url">RTSP URL</label>
          <input type="text" class="form-control" id="edit-url" autocomplete="off">
        </div>
        <div class="text-danger small mt-2 d-none" id="edit-cam-error"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-sm btn-primary" id="btn-save-edit">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {

  // ── Modal instances ─────────────────────────────────────
  var polygonModal = new bootstrap.Modal(document.getElementById('polygonModal'));
  var editCamModal = new bootstrap.Modal(document.getElementById('editCamModal'));

  // ── Load config ─────────────────────────────────────────
  var savedConfig = {};

  fetch('/config.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      savedConfig = data;
      document.getElementById('tg_token').value = data.tg_token || '';
      document.getElementById('tg_chat').value  = data.tg_chat  || '';
      (data.streams || []).forEach(function(item) {
        addStreamRow(item.label, item.url, item.detect_in_polygon || null);
      });
    });

  // ── Add stream row ──────────────────────────────────────
  function addStreamRow(label, url, polygon) {
    var badge = (polygon && polygon.length === 4)
      ? '<span class="badge text-bg-success ms-1">Зона</span>'
      : '<span class="badge text-bg-secondary ms-1 badge-zone-empty">Нет зоны</span>';

    var div = document.createElement('div');
    div.className = 'stream-item';
    div.dataset.label   = label;
    div.dataset.url     = url;
    div.dataset.polygon = (polygon && polygon.length) ? JSON.stringify(polygon) : '';
    div.innerHTML =
      '<span class="stream-label">' +
        '<strong>' + label + '</strong>' + badge +
        '<small>' + url + '</small>' +
      '</span>' +
      '<span class="stream-actions">' +
        '<button class="btn btn-outline-secondary zone-btn" data-label="' + label + '">Зона</button>' +
        '<button class="btn btn-outline-secondary edit-btn">Изм.</button>' +
        '<button class="btn btn-outline-danger delete-btn">Удалить</button>' +
      '</span>';

    document.getElementById('streams').appendChild(div);
  }

  // ── Event delegation on stream list ────────────────────
  document.getElementById('streams').addEventListener('click', function(e) {
    var delBtn  = e.target.closest('.delete-btn');
    var zoneBtn = e.target.closest('.zone-btn');
    var editBtn = e.target.closest('.edit-btn');

    if (delBtn) {
      delBtn.closest('.stream-item').remove();

    } else if (zoneBtn) {
      e.preventDefault();
      openPolygonEditor(zoneBtn.dataset.label);

    } else if (editBtn) {
      var item = editBtn.closest('.stream-item');
      document.getElementById('edit-original-label').value = item.dataset.label;
      document.getElementById('edit-label').value          = item.dataset.label;
      document.getElementById('edit-url').value            = item.dataset.url;
      document.getElementById('edit-cam-error').classList.add('d-none');
      editCamModal.show();
    }
  });

  // ── Add stream ──────────────────────────────────────────
  document.getElementById('btn-add-stream').addEventListener('click', function() {
    var label  = document.getElementById('new-label').value.trim();
    var url    = document.getElementById('new-url').value.trim();
    var errEl  = document.getElementById('add-stream-error');

    if (!label || !/^[a-zA-Z0-9_-]+$/.test(label)) {
      errEl.textContent = 'Label: только латиница, цифры, _ и -';
      errEl.classList.remove('d-none'); return;
    }
    if (document.querySelector('.stream-item[data-label="' + label + '"]')) {
      errEl.textContent = 'Камера с таким label уже существует';
      errEl.classList.remove('d-none'); return;
    }
    if (!url || !url.startsWith('rtsp://')) {
      errEl.textContent = 'URL должен начинаться с rtsp://';
      errEl.classList.remove('d-none'); return;
    }
    errEl.classList.add('d-none');

    addStreamRow(label, url, null);
    document.getElementById('new-label').value = '';
    document.getElementById('new-url').value   = '';
  });

  // ── Edit stream ─────────────────────────────────────────
  document.getElementById('btn-save-edit').addEventListener('click', function() {
    var origLabel = document.getElementById('edit-original-label').value;
    var newLabel  = document.getElementById('edit-label').value.trim();
    var newUrl    = document.getElementById('edit-url').value.trim();
    var errEl     = document.getElementById('edit-cam-error');

    if (!newLabel || !/^[a-zA-Z0-9_-]+$/.test(newLabel)) {
      errEl.textContent = 'Label: только латиница, цифры, _ и -';
      errEl.classList.remove('d-none'); return;
    }
    if (newLabel !== origLabel && document.querySelector('.stream-item[data-label="' + newLabel + '"]')) {
      errEl.textContent = 'Камера с таким label уже существует';
      errEl.classList.remove('d-none'); return;
    }
    if (!newUrl || !newUrl.startsWith('rtsp://')) {
      errEl.textContent = 'URL должен начинаться с rtsp://';
      errEl.classList.remove('d-none'); return;
    }
    errEl.classList.add('d-none');

    if (activeLabel === origLabel) polygonModal.hide();

    var row = document.querySelector('.stream-item[data-label="' + origLabel + '"]');
    row.dataset.label = newLabel;
    row.dataset.url   = newUrl;
    row.querySelector('.zone-btn').dataset.label = newLabel;

    var badgeHTML = row.querySelector('.badge').outerHTML;
    row.querySelector('.stream-label').innerHTML =
      '<strong>' + newLabel + '</strong>' + badgeHTML +
      '<small>' + newUrl + '</small>';

    editCamModal.hide();
  });

  // ── Global save ─────────────────────────────────────────
  document.getElementById('btn_Save').addEventListener('click', function(e) {
    e.preventDefault();
    var config = Object.assign({}, savedConfig, {
      tg_token: document.getElementById('tg_token').value,
      tg_chat:  parseInt(document.getElementById('tg_chat').value, 10) || savedConfig.tg_chat || 0,
      streams:  []
    });

    document.querySelectorAll('.stream-item').forEach(function(item) {
      var streamObj = {
        label: item.dataset.label,
        url:   item.dataset.url,
        detect_in_polygon: [],
        ignore: []
      };
      if (item.dataset.polygon) {
        try { streamObj.detect_in_polygon = JSON.parse(item.dataset.polygon); } catch(e) {}
      }
      config.streams.push(streamObj);
    });

    fetch('/config.save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config)
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      var el = document.getElementById('save-ok');
      el.classList.add('visible');
      setTimeout(function() { el.classList.remove('visible'); }, 2000);
    })
    .catch(function() { alert('Ошибка сохранения'); });
  });

  // ── Polygon editor ──────────────────────────────────────
  var activeLabel       = null;
  var points            = [];
  var frameW = 1, frameH = 1;
  var canvasImg         = new Image();
  var pendingExistingPts = [];

  function openPolygonEditor(label) {
    activeLabel = label;
    points = [];
    document.getElementById('modal-cam-name').textContent = label;

    var row = document.querySelector('.stream-item[data-label="' + label + '"]');
    pendingExistingPts = [];
    if (row && row.dataset.polygon) {
      try { pendingExistingPts = JSON.parse(row.dataset.polygon); } catch(e) {}
    }

    canvasImg = new Image();
    canvasImg.src = '/snapshot/raw/' + label + '?' + Date.now();
    polygonModal.show();
  }

  // Canvas setup runs after modal animation completes (clientWidth is correct)
  document.getElementById('polygonModal').addEventListener('shown.bs.modal', function() {
    var wrap = document.getElementById('canvas-wrap');

    function renderCanvas() {
      var maxW  = wrap.clientWidth;
      var scale = maxW / canvasImg.naturalWidth;
      canvas.width  = Math.round(canvasImg.naturalWidth  * scale);
      canvas.height = Math.round(canvasImg.naturalHeight * scale);
      frameW = canvasImg.naturalWidth;
      frameH = canvasImg.naturalHeight;

      if (pendingExistingPts.length === 4) {
        points = pendingExistingPts.map(function(p) {
          return { cx: p[0] * scale, cy: p[1] * scale };
        });
      }
      redraw();
    }

    if (canvasImg.complete && canvasImg.naturalWidth > 0) {
      renderCanvas();
    } else {
      canvasImg.onload = renderCanvas;
    }
  });

  function redraw() {
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(canvasImg, 0, 0, canvas.width, canvas.height);

    if (points.length === 0) { updateUI(); return; }

    // Filled polygon
    ctx.beginPath();
    ctx.moveTo(points[0].cx, points[0].cy);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i].cx, points[i].cy);
    if (points.length === 4) ctx.closePath();
    ctx.fillStyle = 'rgba(67, 97, 238, 0.18)';
    ctx.fill();

    // Edges
    ctx.beginPath();
    ctx.moveTo(points[0].cx, points[0].cy);
    for (var j = 1; j < points.length; j++) ctx.lineTo(points[j].cx, points[j].cy);
    if (points.length === 4) ctx.closePath();
    ctx.strokeStyle = '#4361ee';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Vertices
    points.forEach(function(p, idx) {
      ctx.beginPath();
      ctx.arc(p.cx, p.cy, 6, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#4361ee';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#4361ee';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(idx + 1, p.cx + 9, p.cy - 5);
    });

    updateUI();
  }

  function updateUI() {
    var n = points.length;
    document.getElementById('point-count').textContent = 'Точек: ' + n + ' / 4';
    document.getElementById('btn-save-zone').disabled  = n !== 4;
  }

  // ── Drag state ──────────────────────────────────────────
  var POINT_RADIUS = 10;
  var dragPointIdx = -1;
  var dragAll      = false;
  var dragStart    = null;
  var pointsSnap   = null;

  function getCanvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { cx: e.clientX - rect.left, cy: e.clientY - rect.top };
  }

  function hitPointIndex(pos) {
    for (var i = 0; i < points.length; i++) {
      var dx = points[i].cx - pos.cx;
      var dy = points[i].cy - pos.cy;
      if (Math.sqrt(dx * dx + dy * dy) <= POINT_RADIUS) return i;
    }
    return -1;
  }

  function isInsidePolygon(pos) {
    if (points.length < 4) return false;
    var ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(points[0].cx, points[0].cy);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i].cx, points[i].cy);
    ctx.closePath();
    return ctx.isPointInPath(pos.cx, pos.cy);
  }

  var canvas = document.getElementById('polygon-canvas');

  canvas.addEventListener('mousedown', function(e) {
    var pos = getCanvasPos(e);
    var idx = hitPointIndex(pos);
    if (idx !== -1) {
      dragPointIdx = idx;
      dragStart    = pos;
      pointsSnap   = points.map(function(p) { return { cx: p.cx, cy: p.cy }; });
      e.preventDefault();
    } else if (isInsidePolygon(pos)) {
      dragAll    = true;
      dragStart  = pos;
      pointsSnap = points.map(function(p) { return { cx: p.cx, cy: p.cy }; });
      e.preventDefault();
    }
  });

  canvas.addEventListener('mousemove', function(e) {
    var pos = getCanvasPos(e);

    if (dragPointIdx !== -1 || dragAll) {
      canvas.style.cursor = 'grabbing';
    } else if (hitPointIndex(pos) !== -1) {
      canvas.style.cursor = 'grab';
    } else if (isInsidePolygon(pos)) {
      canvas.style.cursor = 'move';
    } else {
      canvas.style.cursor = points.length < 4 ? 'crosshair' : 'default';
    }

    if (dragPointIdx !== -1) {
      points[dragPointIdx] = { cx: pos.cx, cy: pos.cy };
      redraw();
    } else if (dragAll && dragStart) {
      var dx = pos.cx - dragStart.cx;
      var dy = pos.cy - dragStart.cy;
      points = pointsSnap.map(function(p) { return { cx: p.cx + dx, cy: p.cy + dy }; });
      redraw();
    }
  });

  canvas.addEventListener('mouseup',    function() { dragPointIdx = -1; dragAll = false; dragStart = null; pointsSnap = null; });
  canvas.addEventListener('mouseleave', function() { dragPointIdx = -1; dragAll = false; dragStart = null; pointsSnap = null; });

  canvas.addEventListener('click', function(e) {
    if (points.length >= 4) return;
    if (dragPointIdx !== -1 || dragAll) return;
    var pos = getCanvasPos(e);
    if (hitPointIndex(pos) !== -1) return;
    points.push(pos);
    redraw();
  });

  document.getElementById('btn-clear-zone').addEventListener('click', function() {
    points = [];
    redraw();
  });

  document.getElementById('btn-save-zone').addEventListener('click', function() {
    var scaleX = frameW / canvas.width;
    var scaleY = frameH / canvas.height;
    var framePoints = points.map(function(p) {
      return [Math.round(p.cx * scaleX), Math.round(p.cy * scaleY)];
    });

    var row = document.querySelector('.stream-item[data-label="' + activeLabel + '"]');
    row.dataset.polygon = JSON.stringify(framePoints);

    var badge = row.querySelector('.badge');
    badge.className   = 'badge text-bg-success ms-1';
    badge.textContent = 'Зона';

    polygonModal.hide();
  });

  document.getElementById('polygonModal').addEventListener('hidden.bs.modal', function() {
    points        = [];
    activeLabel   = null;
    dragPointIdx  = -1;
    dragAll       = false;
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    canvas.style.cursor = 'crosshair';
    updateUI();
  });

}); // DOMContentLoaded
</script>
</body>
</html>
