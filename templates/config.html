<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.4.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
          integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
          integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
  <title>camTGrtsp — Config</title>
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .config-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 1.5rem; margin-bottom: 1.5rem; }
    .stream-item { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
    .stream-item .stream-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .stream-item .stream-actions { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
    #polygon-canvas { cursor: crosshair; display: block; max-width: 100%; }
    #canvas-wrap { position: relative; background: #000; line-height: 0; width: 100%; }
    .point-hint { font-size: .8rem; color: #6c757d; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <a class="navbar-brand" href="/">📷 camTGrtsp</a>
  <span class="text-success small d-none" id="save-ok">Сохранено</span>
</nav>

<div class="container" style="max-width: 700px;">

  <!-- Telegram -->
  <div class="config-card">
    <h6 class="text-muted text-uppercase mb-3" style="font-size:.75rem; letter-spacing:1px;">Telegram</h6>
    <div class="form-group">
      <label for="tg_token">Bot API Token</label>
      <input type="text" class="form-control" id="tg_token" placeholder="123456:ABC-DEF...">
    </div>
    <div class="form-group mb-0">
      <label for="tg_chat">Chat ID</label>
      <input type="text" class="form-control" id="tg_chat" placeholder="-100123456789">
    </div>
  </div>

  <!-- Streams -->
  <div class="config-card">
    <h6 class="text-muted text-uppercase mb-3" style="font-size:.75rem; letter-spacing:1px;">RTSP Streams</h6>
    <ul class="list-group" id="streams"></ul>

    <hr class="mt-3 mb-3">
    <div id="add-stream-form">
      <div class="form-row align-items-end">
        <div class="col-4">
          <label class="small text-muted mb-1" for="new-label">Label</label>
          <input type="text" class="form-control form-control-sm" id="new-label"
                 placeholder="koridor" autocomplete="off">
        </div>
        <div class="col">
          <label class="small text-muted mb-1" for="new-url">RTSP URL</label>
          <input type="text" class="form-control form-control-sm" id="new-url"
                 placeholder="rtsp://admin:password@192.168.1.1:554/..." autocomplete="off">
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-stream">+ Добавить</button>
        </div>
      </div>
      <div class="text-danger small mt-1 d-none" id="add-stream-error"></div>
    </div>
  </div>

  <button type="button" class="btn btn-primary btn-block" id="btn_Save">Сохранить</button>

</div>

<!-- Polygon editor modal -->
<div class="modal fade" id="polygonModal" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Зона детекции: <span id="modal-cam-name"></span></h5>
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <p class="point-hint mb-2">
          Кликайте по изображению чтобы поставить точки зоны. Ровно <strong>4 точки</strong>.
        </p>
        <div id="canvas-wrap">
          <canvas id="polygon-canvas"></canvas>
        </div>
        <div class="mt-2 d-flex justify-content-between align-items-center">
          <span class="point-hint" id="point-count">Точек: 0 / 4</span>
          <button type="button" class="btn btn-sm btn-outline-danger" id="btn-clear-zone">Очистить</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" id="btn-save-zone" disabled>Сохранить зону</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit camera modal -->
<div class="modal fade" id="editCamModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Редактировать камеру</h5>
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-original-label">
        <div class="form-group">
          <label for="edit-label">Label</label>
          <input type="text" class="form-control" id="edit-label" autocomplete="off">
        </div>
        <div class="form-group mb-0">
          <label for="edit-url">RTSP URL</label>
          <input type="text" class="form-control" id="edit-url" autocomplete="off">
        </div>
        <div class="text-danger small mt-2 d-none" id="edit-cam-error"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" id="btn-save-edit">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script>
$(document).ready(function () {

  // ── Load config ──────────────────────────────────────────────
  var savedConfig = {};

  $.getJSON('/config.json', function (data) {
    savedConfig = data;
    $('#tg_token').val(data.tg_token);
    $('#tg_chat').val(data.tg_chat);
    $.each(data.streams, function (key, item) {
      addStreamRow(item.label, item.url, item.detect_in_polygon || null);
    });
  });

  // ── Stream row ───────────────────────────────────────────────
  function addStreamRow(label, url, polygon) {
    var row = $('<li class="list-group-item stream-item"></li>')
      .attr('data-label', label)
      .attr('data-url', url)
      .attr('data-polygon', polygon && polygon.length ? JSON.stringify(polygon) : '');

    var badge = polygon && polygon.length === 4
      ? ' <span class="badge badge-success ml-1">Зона</span>'
      : ' <span class="badge badge-secondary ml-1 badge-zone-empty">Нет зоны</span>';

    row.append('<span class="stream-label"><strong>' + label + '</strong>' + badge +
               '<br><small class="text-muted">' + url + '</small></span>');

    var actions = $('<span class="stream-actions"></span>');
    actions.append(
      $('<button class="btn btn-sm btn-outline-secondary zone-btn">Зона</button>')
        .attr('data-label', label)
    );
    actions.append(
      $('<button class="btn btn-sm btn-outline-secondary edit-btn">Изм.</button>')
    );
    actions.append(
      $('<button class="btn btn-sm btn-outline-danger delete-btn">Удалить</button>')
    );
    row.append(actions);

    row.find('.delete-btn').click(function () {
      $(this).closest('li').remove();
    });

    row.find('.zone-btn').click(function (e) {
      e.preventDefault();
      openPolygonEditor($(this).attr('data-label'));
    });

    row.find('.edit-btn').click(function () {
      var li = $(this).closest('li');
      $('#edit-original-label').val(li.attr('data-label'));
      $('#edit-label').val(li.attr('data-label'));
      $('#edit-url').val(li.attr('data-url'));
      $('#edit-cam-error').addClass('d-none');
      $('#editCamModal').modal('show');
    });

    $('#streams').append(row);
  }

  // ── Add stream ───────────────────────────────────────────────
  $('#btn-add-stream').click(function () {
    var label = $.trim($('#new-label').val());
    var url   = $.trim($('#new-url').val());
    var $err  = $('#add-stream-error');

    if (!label || !/^[a-zA-Z0-9_-]+$/.test(label)) {
      $err.text('Label: только латиница, цифры, _ и -').removeClass('d-none'); return;
    }
    if ($('#streams li[data-label="' + label + '"]').length) {
      $err.text('Камера с таким label уже существует').removeClass('d-none'); return;
    }
    if (!url || !url.startsWith('rtsp://')) {
      $err.text('URL должен начинаться с rtsp://').removeClass('d-none'); return;
    }
    $err.addClass('d-none');

    addStreamRow(label, url, null);
    $('#new-label').val('');
    $('#new-url').val('');
  });

  // ── Edit stream ──────────────────────────────────────────────
  $('#btn-save-edit').click(function () {
    var origLabel = $('#edit-original-label').val();
    var newLabel  = $.trim($('#edit-label').val());
    var newUrl    = $.trim($('#edit-url').val());
    var $err      = $('#edit-cam-error');

    if (!newLabel || !/^[a-zA-Z0-9_-]+$/.test(newLabel)) {
      $err.text('Label: только латиница, цифры, _ и -').removeClass('d-none'); return;
    }
    if (newLabel !== origLabel && $('#streams li[data-label="' + newLabel + '"]').length) {
      $err.text('Камера с таким label уже существует').removeClass('d-none'); return;
    }
    if (!newUrl || !newUrl.startsWith('rtsp://')) {
      $err.text('URL должен начинаться с rtsp://').removeClass('d-none'); return;
    }
    $err.addClass('d-none');

    // Закрыть polygon-редактор если он открыт для этой камеры
    if (activeLabel === origLabel) {
      $('#polygonModal').modal('hide');
    }

    var row = $('#streams li[data-label="' + origLabel + '"]');
    row.attr('data-label', newLabel);
    row.attr('data-url', newUrl);
    row.find('.zone-btn').attr('data-label', newLabel);

    var badgeHtml = row.find('.badge').prop('outerHTML');
    row.find('.stream-label').html(
      '<strong>' + newLabel + '</strong>' + badgeHtml +
      '<br><small class="text-muted">' + newUrl + '</small>'
    );

    $('#editCamModal').modal('hide');
  });

  // ── Global save ──────────────────────────────────────────────
  $('#btn_Save').click(function (e) {
    e.preventDefault();
    var config = $.extend({}, savedConfig, {
      tg_token: $('#tg_token').val(),
      tg_chat: parseInt($('#tg_chat').val(), 10) || savedConfig.tg_chat || 0,
      streams: [],
    });
    $('#streams li').each(function () {
      var streamObj = {
        label: $(this).attr('data-label'),
        url: $(this).attr('data-url'),
        detect_in_polygon: [],
        ignore: [],
      };
      var raw = $(this).attr('data-polygon');
      if (raw) {
        try { streamObj.detect_in_polygon = JSON.parse(raw); } catch (e) {}
      }
      config.streams.push(streamObj);
    });

    $.ajax({
      contentType: 'application/json',
      data: JSON.stringify(config),
      dataType: 'json',
      processData: false,
      type: 'POST',
      url: '/config.save',
      success: function () {
        $('#save-ok').fadeIn().delay(2000).fadeOut();
      },
      error: function () { alert('Ошибка сохранения'); },
    });
  });

  // ── Polygon editor ───────────────────────────────────────────
  var activeLabel = null;
  var points = [];          // [{cx, cy}, ...] in canvas space
  var frameW = 1, frameH = 1;
  var canvasImg = new Image();

  var pendingExistingPts = [];

  function openPolygonEditor(label) {
    activeLabel = label;
    points = [];

    $('#modal-cam-name').text(label);

    // Load existing polygon from row
    var row = $('#streams li[data-label="' + label + '"]');
    var existing = row.attr('data-polygon');
    pendingExistingPts = [];
    if (existing) {
      try { pendingExistingPts = JSON.parse(existing); } catch (e) {}
    }

    canvasImg = new Image();
    canvasImg.src = '/snapshot/raw/' + label + '?' + Date.now();

    $('#polygonModal').modal('show');
  }

  // Load canvas only after modal animation completes — wrap.clientWidth is correct here
  $('#polygonModal').on('shown.bs.modal', function () {
    var canvas = document.getElementById('polygon-canvas');
    var wrap = document.getElementById('canvas-wrap');

    function renderCanvas() {
      var maxW = wrap.clientWidth;
      var scale = maxW / canvasImg.naturalWidth;
      canvas.width  = Math.round(canvasImg.naturalWidth  * scale);
      canvas.height = Math.round(canvasImg.naturalHeight * scale);
      frameW = canvasImg.naturalWidth;
      frameH = canvasImg.naturalHeight;

      if (pendingExistingPts.length === 4) {
        points = pendingExistingPts.map(function (p) {
          return { cx: p[0] * scale, cy: p[1] * scale };
        });
      }

      redraw();
    }

    if (canvasImg.complete && canvasImg.naturalWidth > 0) {
      renderCanvas();
    } else {
      canvasImg.onload = renderCanvas;
    }
  });

  function redraw() {
    var canvas = document.getElementById('polygon-canvas');
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(canvasImg, 0, 0, canvas.width, canvas.height);

    if (points.length === 0) {
      updateUI();
      return;
    }

    // Draw filled polygon (semi-transparent)
    ctx.beginPath();
    ctx.moveTo(points[0].cx, points[0].cy);
    for (var i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].cx, points[i].cy);
    }
    if (points.length === 4) ctx.closePath();
    ctx.fillStyle = 'rgba(0, 200, 100, 0.15)';
    ctx.fill();

    // Draw edges
    ctx.beginPath();
    ctx.moveTo(points[0].cx, points[0].cy);
    for (var j = 1; j < points.length; j++) {
      ctx.lineTo(points[j].cx, points[j].cy);
    }
    if (points.length === 4) ctx.closePath();
    ctx.strokeStyle = '#00e676';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw vertices
    points.forEach(function (p, idx) {
      ctx.beginPath();
      ctx.arc(p.cx, p.cy, 6, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Point number
      ctx.fillStyle = '#00e676';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(idx + 1, p.cx + 9, p.cy - 5);
    });

    updateUI();
  }

  function updateUI() {
    var n = points.length;
    $('#point-count').text('Точек: ' + n + ' / 4');
    $('#btn-save-zone').prop('disabled', n !== 4);
  }

  // ── Drag state ───────────────────────────────────────────────
  var POINT_RADIUS = 10;   // px — hit area for grabbing a vertex
  var dragPointIdx = -1;   // index of point being dragged (-1 = none)
  var dragAll = false;     // dragging whole polygon
  var dragStart = null;    // {cx, cy} mouse position at drag start
  var pointsSnap = null;   // copy of points at drag start

  function getCanvasPos(e) {
    var rect = document.getElementById('polygon-canvas').getBoundingClientRect();
    return { cx: e.clientX - rect.left, cy: e.clientY - rect.top };
  }

  function hitPointIndex(pos) {
    for (var i = 0; i < points.length; i++) {
      var dx = points[i].cx - pos.cx;
      var dy = points[i].cy - pos.cy;
      if (Math.sqrt(dx * dx + dy * dy) <= POINT_RADIUS) return i;
    }
    return -1;
  }

  function isInsidePolygon(pos) {
    if (points.length < 4) return false;
    var canvas = document.getElementById('polygon-canvas');
    var ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(points[0].cx, points[0].cy);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i].cx, points[i].cy);
    ctx.closePath();
    return ctx.isPointInPath(pos.cx, pos.cy);
  }

  var canvas = document.getElementById('polygon-canvas');

  canvas.addEventListener('mousedown', function (e) {
    var pos = getCanvasPos(e);
    var idx = hitPointIndex(pos);
    if (idx !== -1) {
      dragPointIdx = idx;
      dragStart = pos;
      pointsSnap = points.map(function (p) { return { cx: p.cx, cy: p.cy }; });
      e.preventDefault();
    } else if (isInsidePolygon(pos)) {
      dragAll = true;
      dragStart = pos;
      pointsSnap = points.map(function (p) { return { cx: p.cx, cy: p.cy }; });
      e.preventDefault();
    }
  });

  canvas.addEventListener('mousemove', function (e) {
    var pos = getCanvasPos(e);

    // Update cursor
    if (dragPointIdx !== -1 || dragAll) {
      canvas.style.cursor = 'grabbing';
    } else if (hitPointIndex(pos) !== -1) {
      canvas.style.cursor = 'grab';
    } else if (isInsidePolygon(pos)) {
      canvas.style.cursor = 'move';
    } else {
      canvas.style.cursor = points.length < 4 ? 'crosshair' : 'default';
    }

    if (dragPointIdx !== -1) {
      points[dragPointIdx] = { cx: pos.cx, cy: pos.cy };
      redraw();
    } else if (dragAll && dragStart) {
      var dx = pos.cx - dragStart.cx;
      var dy = pos.cy - dragStart.cy;
      points = pointsSnap.map(function (p) { return { cx: p.cx + dx, cy: p.cy + dy }; });
      redraw();
    }
  });

  canvas.addEventListener('mouseup', function () {
    dragPointIdx = -1;
    dragAll = false;
    dragStart = null;
    pointsSnap = null;
  });

  canvas.addEventListener('mouseleave', function () {
    dragPointIdx = -1;
    dragAll = false;
    dragStart = null;
    pointsSnap = null;
  });

  // Canvas click — add new point only when not dragging and < 4 points
  canvas.addEventListener('click', function (e) {
    if (points.length >= 4) return;
    if (dragPointIdx !== -1 || dragAll) return;
    var pos = getCanvasPos(e);
    if (hitPointIndex(pos) !== -1) return;
    points.push(pos);
    redraw();
  });

  // Clear
  $('#btn-clear-zone').click(function () {
    points = [];
    redraw();
  });

  // Save zone → write back to <li> data-polygon
  $('#btn-save-zone').click(function () {
    var scaleX = frameW / document.getElementById('polygon-canvas').width;
    var scaleY = frameH / document.getElementById('polygon-canvas').height;
    var framePoints = points.map(function (p) {
      return [Math.round(p.cx * scaleX), Math.round(p.cy * scaleY)];
    });

    var row = $('#streams li[data-label="' + activeLabel + '"]');
    row.attr('data-polygon', JSON.stringify(framePoints));

    // Update badge
    row.find('.badge').removeClass('badge-secondary badge-success badge-zone-empty')
       .addClass('badge-success').text('Зона');

    $('#polygonModal').modal('hide');
  });

  // Reset on close
  $('#polygonModal').on('hidden.bs.modal', function () {
    points = [];
    activeLabel = null;
    dragPointIdx = -1;
    dragAll = false;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.style.cursor = 'crosshair';
    updateUI();
  });

});
</script>
</body>
</html>
