<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.4.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
          integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
          integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
  <title>camTGrtsp — Config</title>
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .config-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 1.5rem; margin-bottom: 1.5rem; }
    .stream-item { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
    .stream-item .stream-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stream-item .delete { flex-shrink: 0; }
  </style>
  <script>
    $(document).ready(function () {

      $.getJSON('/config.json', function (data) {
        $('#tg_token').val(data.tg_token);
        $('#tg_chat').val(data.tg_chat);

        $.each(data.streams, function (key, item) {
          addStreamRow(item.label, item.url);
        });
      });

      function addStreamRow(label, url) {
        var row = $('<li class="list-group-item stream-item"></li>')
          .attr('data-label', label)
          .attr('data-url', url);
        row.append('<span class="stream-label"><strong>' + label + '</strong> — <span class="text-muted">' + url + '</span></span>');
        row.append('<a href="#" class="delete text-danger small">Удалить</a>');
        row.find('.delete').click(function (e) {
          e.preventDefault();
          $(this).closest('li').remove();
        });
        $('#streams').append(row);
      }

      $('#btn_Save').click(function (e) {
        e.preventDefault();
        var config = {
          tg_token: $('#tg_token').val(),
          tg_chat: $('#tg_chat').val(),
          streams: [],
        };
        $('#streams li').each(function () {
          config.streams.push({ label: $(this).attr('data-label'), url: $(this).attr('data-url'), ignore: [] });
        });

        $.ajax({
          contentType: 'application/json',
          data: JSON.stringify(config),
          dataType: 'json',
          processData: false,
          type: 'POST',
          url: '/config.save',
          success: function () {
            $('#save-ok').fadeIn().delay(2000).fadeOut();
          },
          error: function () {
            alert('Ошибка сохранения');
          },
        });
      });

    });
  </script>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <a class="navbar-brand" href="/">📷 camTGrtsp</a>
  <span class="text-success small d-none" id="save-ok">Сохранено</span>
</nav>

<div class="container" style="max-width: 700px;">

  <!-- Telegram -->
  <div class="config-card">
    <h6 class="text-muted text-uppercase mb-3" style="font-size:.75rem; letter-spacing:1px;">Telegram</h6>
    <div class="form-group">
      <label for="tg_token">Bot API Token</label>
      <input type="text" class="form-control" id="tg_token" placeholder="123456:ABC-DEF...">
    </div>
    <div class="form-group mb-0">
      <label for="tg_chat">Chat ID</label>
      <input type="text" class="form-control" id="tg_chat" placeholder="-100123456789">
    </div>
  </div>

  <!-- Streams -->
  <div class="config-card">
    <h6 class="text-muted text-uppercase mb-3" style="font-size:.75rem; letter-spacing:1px;">RTSP Streams</h6>
    <ul class="list-group" id="streams"></ul>
  </div>

  <button type="button" class="btn btn-primary btn-block" id="btn_Save">Сохранить</button>

</div>

</body>
</html>
